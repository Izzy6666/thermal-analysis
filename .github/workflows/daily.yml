name: Update Thermal Analysis Radar

on:
  workflow_dispatch:
  schedule:
    # GitHub cron 使用 UTC。这里是每天 UTC 00:17，约北京时间 08:17。
    # 故意避开整点，减少高峰期排队。
    - cron: "17 0 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch recent papers
        env:
          OPENALEX_EMAIL: ${{ secrets.OPENALEX_EMAIL }}
        run: python fetch_papers.py

      - name: Commit updated data
        run: |
          git config user.name "thermal-radar-bot"
          git config user.email "thermal-radar-bot@users.noreply.github.com"
          git add data/papers.json
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Update paper radar"
            git push
          fi
