<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thermal Analysis Radar</title>
  <meta name="description" content="热分析潜在应用论文Radar">
  <style>
    :root {
      --bg: #f4f6f8;
      --surface: rgba(255, 255, 255, 0.9);
      --text: #17212b;
      --muted: #667085;
      --line: #dce2e8;
      --accent: #1f6f78;
      --accent-soft: #e4f1f2;
      --shadow: 0 12px 34px rgba(20, 35, 50, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--text);
      background:
        radial-gradient(circle at top left, #dfeff0 0, transparent 34rem),
        var(--bg);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system,
                   BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    header {
      padding: 72px 20px 38px;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 5vw, 4.6rem);
      letter-spacing: -0.05em;
    }

    .subtitle {
      max-width: 760px;
      margin: 18px auto 0;
      color: var(--muted);
      line-height: 1.7;
    }

    .toolbar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: grid;
      grid-template-columns: minmax(200px, 1fr) 220px 180px;
      gap: 12px;
      max-width: 1180px;
      margin: 0 auto 28px;
      padding: 14px 20px;
      backdrop-filter: blur(18px);
    }

    input, select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--surface);
      color: var(--text);
      padding: 13px 14px;
      font: inherit;
      outline: none;
      box-shadow: var(--shadow);
    }

    input:focus, select:focus {
      border-color: var(--accent);
    }

    main {
      max-width: 1180px;
      margin: 0 auto;
      padding: 0 20px 64px;
    }

    .meta {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    article {
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-height: 330px;
      padding: 24px;
      border: 1px solid rgba(220, 226, 232, 0.9);
      border-radius: 22px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    article h2 {
      margin: 0;
      font-size: 1.18rem;
      line-height: 1.45;
    }

    .paper-meta {
      color: var(--muted);
      font-size: 0.88rem;
      line-height: 1.55;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .tag {
      padding: 6px 9px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 0.78rem;
      font-weight: 650;
    }

    .summary {
      margin: 0;
      color: #344054;
      line-height: 1.72;
    }

    .application {
      margin-top: auto;
      padding: 12px 14px;
      border-left: 3px solid var(--accent);
      border-radius: 8px;
      background: #f7fbfb;
      line-height: 1.62;
      font-size: 0.92rem;
    }

    .actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    a {
      color: var(--accent);
      font-weight: 700;
      text-decoration: none;
    }

    details {
      color: var(--muted);
      font-size: 0.88rem;
    }

    details p {
      color: var(--text);
      line-height: 1.65;
    }

    .empty {
      grid-column: 1 / -1;
      padding: 50px 20px;
      text-align: center;
      color: var(--muted);
    }

    footer {
      padding: 20px;
      text-align: center;
      color: var(--muted);
      font-size: 0.85rem;
    }

    @media (max-width: 760px) {
      header { padding-top: 46px; }

      .toolbar {
        grid-template-columns: 1fr;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      .meta {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Thermal Analysis Radar</h1>
    <p class="subtitle">
      自动收集热分析在新能源、电子材料、高分子、循环利用、
      医药食品与失效分析中的潜在应用。
    </p>
  </header>

  <section class="toolbar" aria-label="筛选工具">
    <input id="search" type="search" placeholder="搜索标题、摘要、作者、期刊……">
    <select id="category">
      <option value="">全部应用领域</option>
    </select>
    <select id="technique">
      <option value="">全部热分析技术</option>
    </select>
  </section>

  <main>
    <div class="meta">
      <span id="count">正在加载……</span>
      <span id="updated"></span>
    </div>
    <section id="papers" class="grid"></section>
  </main>

  <footer>
    数据来自 OpenAlex。摘要概括采用抽取式规则生成，不调用大模型。
  </footer>

  <script>
    const state = {
      papers: [],
      search: "",
      category: "",
      technique: ""
    };

    const escapeHtml = (value = "") =>
      value.replace(/[&<>"']/g, character => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      })[character]);

    function populateSelect(id, values) {
      const select = document.getElementById(id);
      [...new Set(values)].sort().forEach(value => {
        const option = document.createElement("option");
        option.value = value;
        option.textContent = value;
        select.appendChild(option);
      });
    }

    function render() {
      const query = state.search.trim().toLowerCase();

      const filtered = state.papers.filter(paper => {
        const haystack = [
          paper.title,
          paper.summary,
          paper.abstract,
          paper.journal,
          ...(paper.authors || [])
        ].join(" ").toLowerCase();

        return (
          (!query || haystack.includes(query)) &&
          (!state.category || (paper.categories || []).includes(state.category)) &&
          (!state.technique || (paper.techniques || []).includes(state.technique))
        );
      });

      document.getElementById("count").textContent =
        `显示 ${filtered.length} / ${state.papers.length} 篇论文`;

      const container = document.getElementById("papers");

      if (!filtered.length) {
        container.innerHTML =
          '<div class="empty">没有匹配结果。筛选器今天没有背叛你，只是确实没找到。</div>';
        return;
      }

      container.innerHTML = filtered.map(paper => `
        <article>
          <div class="tags">
            ${(paper.categories || []).map(tag =>
              `<span class="tag">${escapeHtml(tag)}</span>`
            ).join("")}
            ${(paper.techniques || []).map(tag =>
              `<span class="tag">${escapeHtml(tag)}</span>`
            ).join("")}
          </div>

          <h2>${escapeHtml(paper.title)}</h2>

          <div class="paper-meta">
            ${escapeHtml((paper.authors || []).join(", ") || "作者未列出")}
            <br>
            ${escapeHtml(paper.journal || "期刊未列出")}
            · ${escapeHtml(paper.publication_date || "日期未列出")}
          </div>

          <p class="summary">${escapeHtml(paper.summary)}</p>

          <div class="application">
            <strong>潜在应用提示：</strong>
            ${escapeHtml(paper.application_hint || "")}
          </div>

          <div class="actions">
            <a href="${escapeHtml(paper.url)}" target="_blank" rel="noopener">
              查看原文 ↗
            </a>

            <details>
              <summary>查看原摘要</summary>
              <p>${escapeHtml(paper.abstract || "暂无摘要")}</p>
            </details>
          </div>
        </article>
      `).join("");
    }

    async function init() {
      const response = await fetch("./data/papers.json", { cache: "no-store" });

      if (!response.ok) {
        throw new Error(`无法读取 papers.json：${response.status}`);
      }

      const data = await response.json();
      state.papers = data.papers || [];

      populateSelect(
        "category",
        state.papers.flatMap(paper => paper.categories || [])
      );
      populateSelect(
        "technique",
        state.papers.flatMap(paper => paper.techniques || [])
      );

      document.getElementById("updated").textContent =
        `最后更新：${data.updated_at || "未知"}`;

      render();
    }

    document.getElementById("search").addEventListener("input", event => {
      state.search = event.target.value;
      render();
    });

    document.getElementById("category").addEventListener("change", event => {
      state.category = event.target.value;
      render();
    });

    document.getElementById("technique").addEventListener("change", event => {
      state.technique = event.target.value;
      render();
    });

    init().catch(error => {
      document.getElementById("papers").innerHTML =
        `<div class="empty">${escapeHtml(error.message)}</div>`;
      document.getElementById("count").textContent = "加载失败";
    });
  </script>
</body>
</html>
